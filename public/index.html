<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <title>Collaborative Soundboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Tone.js + Socket.IO</p>
        <h1>Collaborative Soundboard</h1>
        <p class="intro">
          Open the same room on several computers. A pad pressed by anyone
          plays on every connected device.
        </p>
      </header>

      <section class="connection-panel" aria-label="Connection controls">
        <label for="roomInput">Room code</label>
        <div class="room-row">
          <input
            id="roomInput"
            maxlength="30"
            autocomplete="off"
            spellcheck="false"
            value="main"
          />
          <button id="startButton" class="start-button">Start audio & join</button>
        </div>

        <div class="status-row">
          <span id="connectionStatus" class="status">Connecting…</span>
          <span><strong id="userCount">0</strong> connected</span>
        </div>

        <p class="share-line">
          Share this room:
          <button id="copyButton" class="text-button" disabled>Copy room link</button>
        </p>
      </section>

      <section id="padGrid" class="pad-grid" aria-label="Sound pads">
        <button class="pad kick" data-pad="kick" disabled>
          <span>Kick</span><small>C1</small>
        </button>
        <button class="pad snare" data-pad="snare" disabled>
          <span>Snare</span><small>Noise</small>
        </button>
        <button class="pad hat" data-pad="hat" disabled>
          <span>Hi-hat</span><small>Noise</small>
        </button>
        <button class="pad bass" data-pad="bass" disabled>
          <span>Bass</span><small>C2</small>
        </button>
        <button class="pad chord" data-pad="chord" disabled>
          <span>Chord</span><small>C minor 7</small>
        </button>
        <button class="pad bell" data-pad="bell" disabled>
          <span>Bell</span><small>G5</small>
        </button>
        <button class="pad pluck" data-pad="pluck" disabled>
          <span>Pluck</span><small>Eb4</small>
        </button>
        <button class="pad pulse" data-pad="pulse" disabled>
          <span>Pulse</span><small>G3</small>
        </button>
      </section>

      <p id="message" class="message" role="status">
        Press “Start audio & join” on every device.
      </p>
    </main>

    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
