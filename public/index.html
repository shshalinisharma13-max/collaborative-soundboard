<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a20d24" />
    <meta name="description" content="A live audience soundboard controlled from your phone." />
    <title>Hero Soundboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="audience-page">
    <div class="web web-top" aria-hidden="true"></div>
    <div class="web web-bottom" aria-hidden="true"></div>
    <div id="reaction" class="reaction" aria-hidden="true">THWIP!</div>

    <main class="app audience-app">
      <header class="hero-header">
        <p class="eyebrow">Live audience controls</p>
        <h1>Hero<br /><span>Soundboard</span></h1>
        <p class="intro">Tap a web badge. The sound plays from the host speaker—not your phone.</p>
      </header>

      <section class="connection-panel" aria-label="Soundboard connection">
        <label for="roomInput">Mission code</label>
        <div class="room-row">
          <input id="roomInput" maxlength="30" autocomplete="off" spellcheck="false" value="main" />
          <button id="joinButton" class="comic-button">Join mission</button>
        </div>
        <div class="status-row">
          <span id="connectionStatus" class="status">Connecting…</span>
          <span class="hero-count"><strong id="userCount">0</strong> heroes online</span>
        </div>
      </section>

      <section id="padGrid" class="pad-grid" aria-label="Sound buttons">
        <button class="pad background-pad" data-sound="sneaky-mischief" disabled>
          <span class="pad-icon" aria-hidden="true">🕵️</span><span>Sneaky Mischief</span><small>Background · tap to toggle</small>
        </button>
        <button class="pad" data-sound="romantic-moment" disabled>
          <span class="pad-icon" aria-hidden="true">💘</span><span>Romantic Moment</span><small>One shot</small>
        </button>
        <button class="pad" data-sound="love-theme" disabled>
          <span class="pad-icon" aria-hidden="true">❤️</span><span>Love Theme</span><small>One shot</small>
        </button>
        <button class="pad background-pad" data-sound="suspense" disabled>
          <span class="pad-icon" aria-hidden="true">🔪</span><span>Suspense</span><small>Background · tap to toggle</small>
        </button>
        <button class="pad" data-sound="rewind" disabled>
          <span class="pad-icon" aria-hidden="true">⏪</span><span>Rewind</span><small>One shot</small>
        </button>
        <button class="pad" data-sound="bruh" disabled>
          <span class="pad-icon" aria-hidden="true">😐</span><span>Bruh</span><small>One shot</small>
        </button>
        <button class="pad" data-sound="well-be-right-back" disabled>
          <span class="pad-icon" aria-hidden="true">📺</span><span>We’ll Be Right Back</span><small>One shot</small>
        </button>
        <button class="pad" data-sound="faah" disabled>
          <span class="pad-icon" aria-hidden="true">😱</span><span>Faah!</span><small>One shot</small>
        </button>
      </section>

      <p id="message" class="message" role="status">Join the mission to activate your web shooters.</p>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/audience.js"></script>
  </body>
</html>
